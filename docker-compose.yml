version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: >
      psycopg2-binary boto3 pandas pyarrow dbt-postgres==1.7.0
      requests websockets aiohttp kafka-python
    POSTGRES_HOST: postgres-crypto
    POSTGRES_PORT: "5432"
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  env_file: [.env]
  volumes:
    - ./dags:/opt/airflow/dags
    - ./feeds:/opt/airflow/feeds
    - ./dbt_project:/opt/airflow/dbt_project
    - ./config:/opt/airflow/config
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      retries: 8
      start_period: 30s

  spark:
    image: apache/spark:3.5.3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "8090:8080"   # Spark UI (avoid conflict with Airflow on 8080)
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark-apps
      - ./checkpoints:/opt/spark-checkpoints
      - ./config:/opt/config

  spark-worker:
    image: apache/spark:3.5.3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark:7077"]
    environment:
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark

  spark-streaming:
    image: apache/spark:3.5.3
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        pip install --quiet --target=/tmp/py-deps python-dotenv psycopg2-binary
        PYTHONPATH=/tmp/py-deps bash /opt/spark-apps/run_streaming.sh
    volumes:
      - ./spark:/opt/spark-apps
      - ./checkpoints:/opt/spark-checkpoints
      - ./config:/opt/config
    depends_on:
      kafka:
        condition: service_healthy
      postgres-crypto:
        condition: service_healthy

  postgres-airflow:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data

  postgres-crypto:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto123}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_db}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-crypto}"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-crypto-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: scheduler

  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres-crypto:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create --username admin --firstname Admin \
          --lastname User --role Admin \
          --email admin@crypto.com --password admin

volumes:
  postgres-airflow-data:
  postgres-crypto-data:
  grafana-data:
